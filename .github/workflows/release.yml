# Parked until the first real release.
#
# This is the §4 release pipeline, complete and ready, but its trigger is manual on purpose.
# It used to run on every push to main, and `changeset publish` will publish any package whose
# version is not already on the registry, so a push would have shipped all five packages to npm
# before anyone had decided to.
#
# To go live: add the `push:` trigger back below, and make sure NPM_TOKEN is set in repo secrets.
#
# on:
#   push:
#     branches:
#       - main

name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Check bundles
        run: npm run check:bundles

      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
