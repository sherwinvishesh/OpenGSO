# Parked until the first real release.
#
# This is the §4 release pipeline, complete and ready, but its trigger is manual on purpose.
# It used to run on every push to main, and `changeset publish` will publish any package whose
# version is not already on the registry, so a push would have shipped all five packages to npm
# before anyone had decided to.
#
# Before the first run, in the repository settings:
#  - Create the `release` environment (Settings > Environments > New environment) and give it
#    required reviewers. The `release` job names it, so it waits for one of them to approve. The
#    workflow cannot create it: a job naming an environment that does not exist gets one made on the
#    fly with no protection rules, which is no gate at all.
#  - Allow GitHub Actions to create pull requests (Settings > Actions > General), or the "Version
#    Packages" pull request cannot be opened.
#  - Make the repository public, because npm will not attach provenance to a package built from a
#    private one, and NPM_CONFIG_PROVENANCE below makes a publish without it fail.
#
# npm authenticates this job by trusted publishing: npm trusts this workflow, in this repository,
# running in the `release` environment, and no token is stored anywhere. npm only offers that for a
# package that already exists, so the first version of each package is published another way:
# by hand from a maintainer's machine, or by this workflow with a short-lived granular token saved
# as NPM_TOKEN on the `release` environment and deleted once trusted publishing is set up.
#
# A run does one of two things. With changesets pending, it opens the "Version Packages" pull
# request and publishes nothing. With none, `npm run release` refuses any package still at a
# placeholder version (scripts/check-release-versions.mjs) and then publishes.
#
# To go live: add the `push:` trigger back below.
#
# on:
#   push:
#     branches:
#       - main

name: Release

on:
  workflow_dispatch:

# Nothing gets a scope it does not ask for by name in its own job.
permissions: {}

# One release at a time, across every ref, and never cancelled halfway: a publish that stops after
# two of five packages leaves the registry in a state nobody chose.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      - run: npm run check:packages
      # The only check that reads the published .d.ts the way a user's TypeScript does.
      - run: npm run example:build

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. A job that names an environment waits for that environment's reviewers.
    environment: release
    permissions:
      # Push the version commit and tags, and open the "Version Packages" pull request.
      contents: write
      pull-requests: write
      # Lets npm sign a provenance statement tying each tarball to this workflow run. Only this job
      # can request the token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles it and Node 22 does not.
          node-version: 24
          # Writes the .npmrc that reads NODE_AUTH_TOKEN. With no token, npm publishes by trusted
          # publishing instead.
          registry-url: https://registry.npmjs.org

      - run: npm ci
      # Rebuilt here because these are the files that ship, so the checks that read dist/ run again
      # against them rather than against the verify job's copy.
      - run: npm run build
      - run: npm run check:bundles
      - run: npm run check:packages

      # The 2.x line is the action for Changesets 3, which this repository uses. It no longer writes
      # an .npmrc from NPM_TOKEN, which is why setup-node does that above. (`v2` is a branch of that
      # repository, not a tag, which is one more reason to pin the commit.)
      - name: Create Release PR or Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
        env:
          # Empty once the NPM_TOKEN secret is deleted, which leaves trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The same as `npm publish --provenance` on every publish `changeset publish` runs, which
          # has no flag of its own to pass it through. Trusted publishing adds it anyway; a token
          # publish needs this.
          NPM_CONFIG_PROVENANCE: true
