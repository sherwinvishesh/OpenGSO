name: Checks

# Paused: runs only when started by hand from the Actions tab, while main moves fast.
# To turn it back on, replace workflow_dispatch with:
#
#   push:
#     branches:
#       - main
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range (engines >=22). The other systems run the floor only.
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      # What a user installs: each bin starts, each export imports by name, each tarball has its files.
      - run: npm run check:packages
      # The demo is the integration test for opengeo-prod/next against a real Next.js build.
      - run: npm run example:build
