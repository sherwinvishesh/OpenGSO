name: Checks

# Every push to main and every pull request, plus a manual start from the Actions tab.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range (engines >=22). The other systems run the floor only.
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # What a user installs is jsdom and its tree, so a known hole there fails the build. Once, since
      # the answer does not depend on the runner.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      # What a user installs: each bin starts, each export imports by name, each tarball has its files.
      - run: npm run check:packages
      # The demo is the integration test for omnigeo-prod/next against a real Next.js build.
      - run: npm run example:build
