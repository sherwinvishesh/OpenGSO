name: Checks

# Every push to main and every pull request, plus a manual start from the Actions tab.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit, with the release it belongs to in a comment: a tag can be
# moved to other code, a commit cannot. scripts/check-actions.mjs holds every workflow to that, and
# Dependabot moves the pins.
jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range (engines >=22). The other systems run the floor only.
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # What a user installs is jsdom and its tree, so a known hole there fails the build. Once, since
      # the answer does not depend on the runner.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      # What a user installs: each bin starts, each export imports by name, each tarball has its files.
      - run: npm run check:packages
      # The demo is the integration test for opengso-prod/next against a real Next.js build.
      - run: npm run example:build

  # The three commands the demo README gives a user, run with the CLI a user gets: built, packed and
  # installed from that tarball, against the demo served by `next start`.
  e2e:
    name: The pipeline against the demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install:global
      - run: npm run example:build
      - name: Start the demo
        run: |
          npm run example:start > demo.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 1
          done
          cat demo.log
          exit 1
      - run: opengso generate http://localhost:3000 --project examples/nextjs-demo
      # The committed twins and manifest are what generate writes today. A diff here means a demo
      # page or the extractor changed and nobody ran generate.
      - run: git diff --exit-code -- examples/nextjs-demo/public examples/nextjs-demo/.opengso
      - run: opengso prod test http://localhost:3000/ --project examples/nextjs-demo
      - run: opengso test http://localhost:3000/resume --structure --strict --json | tee result.json
      # B7 is the one open suggestion, and it stays open on purpose: Next's App Router will not let a
      # proxy add Vary to an HTML response it did not create, so the demo scores it 2 of 4. The
      # numbers are exact so that a change in either direction is noticed.
      - name: 100 of 100, 14 of 15 suggestions adopted
        run: |
          node - <<'JS'
          const result = JSON.parse(require('node:fs').readFileSync('result.json', 'utf8'));
          const open = result.checks
            .filter((check) => !check.scored && check.status !== 'pass' && check.status !== 'na')
            .map((check) => check.id + ' ' + check.status);
          console.log(result.score + '/100, ' + result.scored.pass + ' of ' + result.scored.count + ' scored checks passed, '
            + result.suggestions.adopted + ' of ' + result.suggestions.count + ' suggestions adopted; open: ' + (open.join(', ') || 'none'));
          const expected = result.score === 100 && result.scored.pass === result.scored.count
            && result.suggestions.count === 15 && result.suggestions.adopted === 14 && open.join() === 'B7 partial';
          if (!expected) process.exit(1);
          JS

  # The workflows themselves, and every link between files in the repository.
  lint:
    name: Workflows and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # No npm ci: both scripts use Node builtins only.
      - run: node scripts/check-actions.mjs
      - run: node scripts/check-links.mjs
      # The release binary, by version and checksum, rather than a third-party action around it.
      # shellcheck is on the runner, so every `run:` block above is checked too.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint
