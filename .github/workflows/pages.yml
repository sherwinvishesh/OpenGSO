name: Website

# The site in website/, published to GitHub Pages as it is: no build step, the files are the site.
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push replaces a queued one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Links, the numbers the pages quote, and the twins generated from the current HTML.
      - run: npx vitest run packages/core/tests/website.test.js

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
